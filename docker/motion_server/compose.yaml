services:
  motion_server:
    build:
      context: ../..
      dockerfile: docker/motion_server/Dockerfile

    image: motion-server:dev
    container_name: ${MOTION_SERVER_CONTAINER_NAME:-motion-server}

    network_mode: host
    privileged: true

    working_dir: /workspace

    volumes:
      - ../..:/workspace

    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      MOTION_SERVER_BACKEND: ${MOTION_SERVER_BACKEND:-pysoem}
      MOTION_SERVER_MODE: ${MOTION_SERVER_MODE:-basic}
      MOTION_SERVER_SIMULATION_API_ENABLED: ${MOTION_SERVER_SIMULATION_API_ENABLED:-0}
      MOTION_SERVER_BUS: ${MOTION_SERVER_BUS:-cmmt_as}
      MOTION_SERVER_DEVICE_CONFIG_ROOT: ${MOTION_SERVER_DEVICE_CONFIG_ROOT:-device}
      PYSOEM_INTERFACE: ${PYSOEM_INTERFACE:-enp1s0}
      MOTION_SERVER_PORT: ${MOTION_SERVER_PORT:-15000}
      PYSOEM_CYCLE_TIME: ${PYSOEM_CYCLE_TIME:-0.01}
      MOTION_SERVER_FEEDBACK_PERIOD: ${MOTION_SERVER_FEEDBACK_PERIOD:-0.05}
      PYSOEM_SPIN_WAIT_TIME: ${PYSOEM_SPIN_WAIT_TIME:-0.00015}
      MOTION_SERVER_CPUSET: ${MOTION_SERVER_CPUSET:-}
      PYSOEM_SYNC_MODE: ${PYSOEM_SYNC_MODE:-0}
      PYSOEM_DC_ENABLED: ${PYSOEM_DC_ENABLED:-0}
      PYSOEM_DC_SYNC0_SHIFT_TIME_NS: ${PYSOEM_DC_SYNC0_SHIFT_TIME_NS:-0}
      PYSOEM_DC_PHASE_LOCK: ${PYSOEM_DC_PHASE_LOCK:-0}
      PYSOEM_DC_ABSOLUTE_SHIFT: ${PYSOEM_DC_ABSOLUTE_SHIFT:-0}
      PYSOEM_DC_PHASE_OFFSET_NS: ${PYSOEM_DC_PHASE_OFFSET_NS:-800000}
      PYSOEM_DC_PHASE_KP: ${PYSOEM_DC_PHASE_KP:-0.05}
      PYSOEM_DC_PHASE_KI: ${PYSOEM_DC_PHASE_KI:-0.0005}
      PYSOEM_DC_PHASE_MAX_CORRECTION: ${PYSOEM_DC_PHASE_MAX_CORRECTION:-0.001}
      MOTION_SERVER_STATUS_LOG_PERIOD: ${MOTION_SERVER_STATUS_LOG_PERIOD:-1.0}
      MOTION_SERVER_COMMAND_LOGS: ${MOTION_SERVER_COMMAND_LOGS:-0}
      MOTION_SERVER_CYCLE_STATS_LOGS: ${MOTION_SERVER_CYCLE_STATS_LOGS:-1}
      MOTION_SERVER_CYCLE_STATS_PERIOD: ${MOTION_SERVER_CYCLE_STATS_PERIOD:-1.0}
      MOTION_SERVER_CSP_PROFILE: ${MOTION_SERVER_CSP_PROFILE:-quintic}
      MOTION_SERVER_CSP_JERK: ${MOTION_SERVER_CSP_JERK:-100000.0}
      MOTION_SERVER_CSP_INTERPOLATION_MODE: ${MOTION_SERVER_CSP_INTERPOLATION_MODE:-1}
      MOTION_SERVER_CSP_VELOCITY_OFFSET: ${MOTION_SERVER_CSP_VELOCITY_OFFSET:-0}
      ROS_BRIDGE_COMMAND_LOGS: ${ROS_BRIDGE_COMMAND_LOGS:-0}
      MOTION_SERVER_TRAJECTORY_SNAPSHOT_LOGS: ${MOTION_SERVER_TRAJECTORY_SNAPSHOT_LOGS:-0}
      MOTION_SERVER_TRAJECTORY_DEBUG_LOGS: ${MOTION_SERVER_TRAJECTORY_DEBUG_LOGS:-0}
      MOTION_SERVER_CSP_COMMAND_STEP_LOGS: ${MOTION_SERVER_CSP_COMMAND_STEP_LOGS:-0}
      MOTION_SERVER_CSP_COMMAND_STEP_THRESHOLD: ${MOTION_SERVER_CSP_COMMAND_STEP_THRESHOLD:-0.0}
      MOTION_SERVER_CSP_COMMAND_STEP_ERROR_THRESHOLD: ${MOTION_SERVER_CSP_COMMAND_STEP_ERROR_THRESHOLD:-0.0}
      MOTION_SERVER_DERIVED_VELOCITY_ALPHA: ${MOTION_SERVER_DERIVED_VELOCITY_ALPHA:-0.2}
      MOTION_SERVER_VELOCITY_ANOMALY_LOGS: ${MOTION_SERVER_VELOCITY_ANOMALY_LOGS:-0}
      MOTION_SERVER_VELOCITY_ANOMALY_THRESHOLD: ${MOTION_SERVER_VELOCITY_ANOMALY_THRESHOLD:-15.0}
      MOTION_SERVER_VELOCITY_JUMP_THRESHOLD: ${MOTION_SERVER_VELOCITY_JUMP_THRESHOLD:-15.0}
      MOTION_SERVER_VELOCITY_ANOMALY_LOG_PERIOD: ${MOTION_SERVER_VELOCITY_ANOMALY_LOG_PERIOD:-0.05}
      MOTION_SERVER_POSITION_FEEDBACK_LAG_LOGS: ${MOTION_SERVER_POSITION_FEEDBACK_LAG_LOGS:-0}
      MOTION_SERVER_POSITION_FEEDBACK_LAG_LOG_PERIOD: ${MOTION_SERVER_POSITION_FEEDBACK_LAG_LOG_PERIOD:-0.2}
      MOTION_SERVER_MOTION_MODE: ${MOTION_SERVER_MOTION_MODE:-pp}

    command:
      - bash
      - /workspace/motion_server/start_server.sh

    restart: unless-stopped

  axis_panel:
    build:
      context: ../..
      dockerfile: docker/axis_panel/Dockerfile

    image: motion-server-control-panel:dev

    network_mode: host

    working_dir: /workspace

    volumes:
      - ../..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      DISPLAY: ${DISPLAY:-:0}
      AXIS_CONTROL_PANEL_CONFIG_ROOT: /workspace/control_panel/axis_control_panel
      MOTION_SERVER_HOST: ${MOTION_SERVER_HOST:-127.0.0.1}
      MOTION_SERVER_PORT: ${MOTION_SERVER_PORT:-15000}
      AXIS_CONTROL_PANEL_AXIS_NAMES: ${AXIS_CONTROL_PANEL_AXIS_NAMES:-}

    command:
      - python3
      - -B
      - -m
      - control_panel.axis_control_panel.control_panel

    profiles:
      - panel

  io_panel:
    build:
      context: ../..
      dockerfile: docker/axis_panel/Dockerfile

    image: motion-server-control-panel:dev

    network_mode: host

    working_dir: /workspace

    volumes:
      - ../..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      DISPLAY: ${DISPLAY:-:0}
      IO_CONTROL_PANEL_CONFIG_ROOT: /workspace/control_panel/io_control_panel
      MOTION_SERVER_HOST: ${MOTION_SERVER_HOST:-127.0.0.1}
      MOTION_SERVER_PORT: ${MOTION_SERVER_PORT:-15000}

    command:
      - python3
      - -B
      - -m
      - control_panel.io_control_panel.control_panel

    profiles:
      - panel
