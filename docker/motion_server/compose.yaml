services:
  motion_server:
    build:
      context: ../..
      dockerfile: docker/motion_server/Dockerfile

    image: ros2_cia402_motion_server:dev
    container_name: ros_cia402_motion_server

    network_mode: host
    privileged: true

    working_dir: /workspace

    volumes:
      - ../..:/workspace

    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      MOTION_SERVER_BACKEND: ${MOTION_SERVER_BACKEND:-${AXIS_SERVER_BACKEND:-pysoem}}
      MOTION_SERVER_MODE: ${MOTION_SERVER_MODE:-${AXIS_SERVER_MODE:-basic}}
      PYSOEM_BUS: ${PYSOEM_BUS:-cmmt}
      PYSOEM_INTERFACE: ${PYSOEM_INTERFACE:-enp1s0}
      MOTION_SERVER_PORT: ${MOTION_SERVER_PORT:-${AXIS_SERVER_PORT:-15000}}
      PYSOEM_CYCLE_TIME: ${PYSOEM_CYCLE_TIME:-0.01}
      PYSOEM_SPIN_WAIT_TIME: ${PYSOEM_SPIN_WAIT_TIME:-0.00015}
      MOTION_SERVER_CPUSET: ${MOTION_SERVER_CPUSET:-${AXIS_SERVER_CPUSET:-}}
      PYSOEM_SYNC_MODE: ${PYSOEM_SYNC_MODE:-0}
      PYSOEM_DC_ENABLED: ${PYSOEM_DC_ENABLED:-0}
      PYSOEM_DC_SYNC0_SHIFT_TIME_NS: ${PYSOEM_DC_SYNC0_SHIFT_TIME_NS:-0}
      PYSOEM_DC_PHASE_LOCK: ${PYSOEM_DC_PHASE_LOCK:-0}
      PYSOEM_DC_ABSOLUTE_SHIFT: ${PYSOEM_DC_ABSOLUTE_SHIFT:-0}
      PYSOEM_DC_PHASE_OFFSET_NS: ${PYSOEM_DC_PHASE_OFFSET_NS:-800000}
      PYSOEM_DC_PHASE_KP: ${PYSOEM_DC_PHASE_KP:-0.05}
      PYSOEM_DC_PHASE_KI: ${PYSOEM_DC_PHASE_KI:-0.0005}
      PYSOEM_DC_PHASE_MAX_CORRECTION: ${PYSOEM_DC_PHASE_MAX_CORRECTION:-0.001}
      PYSOEM_MAX_VELOCITY: ${PYSOEM_MAX_VELOCITY:-50.0}
      PYSOEM_ACCELERATION: ${PYSOEM_ACCELERATION:-100.0}
      PYSOEM_DECELERATION: ${PYSOEM_DECELERATION:-100.0}
      PYSOEM_JERK: ${PYSOEM_JERK:-1000.0}
      PYSOEM_PP_JERK: ${PYSOEM_PP_JERK:-100000}
      PYSOEM_STATUS_LOG_PERIOD: ${PYSOEM_STATUS_LOG_PERIOD:-1.0}
      MOTION_SERVER_COMMAND_LOGS: ${MOTION_SERVER_COMMAND_LOGS:-${AXIS_SERVER_COMMAND_LOGS:-0}}
      PYSOEM_CYCLE_STATS_LOGS: ${PYSOEM_CYCLE_STATS_LOGS:-1}
      PYSOEM_CYCLE_STATS_PERIOD: ${PYSOEM_CYCLE_STATS_PERIOD:-1.0}
      PYSOEM_CSP_COUNTS_PER_UNIT: ${PYSOEM_CSP_COUNTS_PER_UNIT:-1.0}
      PYSOEM_CSP_PROFILE: ${PYSOEM_CSP_PROFILE:-quintic}
      PYSOEM_CSP_INTERPOLATION_MODE: ${PYSOEM_CSP_INTERPOLATION_MODE:-1}
      PYSOEM_CSP_VELOCITY_OFFSET: ${PYSOEM_CSP_VELOCITY_OFFSET:-0}
      ROS_BRIDGE_COMMAND_LOGS: ${ROS_BRIDGE_COMMAND_LOGS:-0}
      PYSOEM_TRAJECTORY_SNAPSHOT_LOGS: ${PYSOEM_TRAJECTORY_SNAPSHOT_LOGS:-0}
      PYSOEM_TRAJECTORY_DEBUG_LOGS: ${PYSOEM_TRAJECTORY_DEBUG_LOGS:-0}
      PYSOEM_CSP_COMMAND_STEP_LOGS: ${PYSOEM_CSP_COMMAND_STEP_LOGS:-0}
      PYSOEM_CSP_COMMAND_STEP_THRESHOLD: ${PYSOEM_CSP_COMMAND_STEP_THRESHOLD:-0.0}
      PYSOEM_CSP_COMMAND_STEP_ERROR_THRESHOLD: ${PYSOEM_CSP_COMMAND_STEP_ERROR_THRESHOLD:-0.0}
      PYSOEM_DERIVED_VELOCITY_ALPHA: ${PYSOEM_DERIVED_VELOCITY_ALPHA:-0.2}
      PYSOEM_VELOCITY_ANOMALY_LOGS: ${PYSOEM_VELOCITY_ANOMALY_LOGS:-0}
      PYSOEM_VELOCITY_ANOMALY_THRESHOLD: ${PYSOEM_VELOCITY_ANOMALY_THRESHOLD:-15.0}
      PYSOEM_VELOCITY_JUMP_THRESHOLD: ${PYSOEM_VELOCITY_JUMP_THRESHOLD:-15.0}
      PYSOEM_VELOCITY_ANOMALY_LOG_PERIOD: ${PYSOEM_VELOCITY_ANOMALY_LOG_PERIOD:-0.05}
      PYSOEM_POSITION_FEEDBACK_LAG_LOGS: ${PYSOEM_POSITION_FEEDBACK_LAG_LOGS:-0}
      PYSOEM_POSITION_FEEDBACK_LAG_LOG_PERIOD: ${PYSOEM_POSITION_FEEDBACK_LAG_LOG_PERIOD:-0.2}
      PYSOEM_MOTION_MODE: ${PYSOEM_MOTION_MODE:-pp}

    command:
      - bash
      - /workspace/motion_server/start_server.sh

    restart: unless-stopped

  axis_panel:
    build:
      context: ../..
      dockerfile: docker/axis_panel/Dockerfile

    image: ros2_cia402_axis_panel:dev

    network_mode: host

    working_dir: /workspace

    volumes:
      - ../..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      DISPLAY: ${DISPLAY:-:0}
      AXIS_CONTROL_PANEL_CONFIG_ROOT: /workspace/axis_control_panel
      MOTION_SERVER_HOST: ${MOTION_SERVER_HOST:-127.0.0.1}
      MOTION_SERVER_PORT: ${MOTION_SERVER_PORT:-15000}
      AXIS_CONTROL_PANEL_AXIS_NAMES: ${AXIS_CONTROL_PANEL_AXIS_NAMES:-}

    command:
      - python3
      - -B
      - /workspace/axis_control_panel/control_panel.py

    profiles:
      - panel
